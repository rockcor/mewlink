name: Signed beta draft
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Refuse a release without signing credentials
        run: node scripts/check-release-signing.mjs
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:release
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MewLink ${{ github.ref_name }}'
          releaseBody: 'Developer preview. New connections use a native Olm ratchet and require both people to update, pair again and compare safety numbers. This integration has not received an independent security audit. macOS requires Developer ID signing and notarization. Windows installer signing is not yet configured. Do not use for sensitive communication.'
          releaseDraft: true
          prerelease: true
      - name: Verify macOS signature and stapled notarization ticket
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/MewLink.app
          xcrun stapler validate src-tauri/target/release/bundle/macos/MewLink.app
          spctl --assess --type execute --verbose=2 src-tauri/target/release/bundle/macos/MewLink.app
